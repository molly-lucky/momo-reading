<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记 · 市场观察</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #3a3632;
  --text-light: #8a847c;
  --accent: #6b5b4f;
  --accent-soft: #a89a8c;
  --border: #ece7e1;
  --shadow: 0 4px 20px rgba(107, 91, 79, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Serif SC", "Songti SC", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  padding: 20px 16px;
}
.container { max-width: 1080px; margin: 0 auto; }
header {
  text-align: center;
  padding: 36px 20px 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
header h1 { font-weight: 500; font-size: 30px; letter-spacing: 3px; }
header p { color: var(--text-light); margin-top: 8px; font-size: 14px; letter-spacing: 2px; }
.tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; }
.tab {
  padding: 8px 22px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-light);
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 1px;
  border-radius: 4px;
}
.tab.active { background: var(--accent); color: #faf8f5; border-color: var(--accent); }
.section { display: none; }
.section.active { display: block; }
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}
.search-box, .filter-select, .btn, .date-input {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
  background: white;
  color: var(--text);
  font-family: inherit;
}
.btn { background: var(--accent); color: #faf8f5; border: none; cursor: pointer; letter-spacing: 1px; }
.btn:hover { background: #5a4b41; }
.btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent-soft); }
.notes-grid, .news-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}
.note-card, .news-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.note-card { transition: transform 0.2s; }
.note-card:hover { transform: translateY(-2px); }
.cover-wrapper { height: 190px; background: #f4f0eb; display: flex; align-items: center; justify-content: center; }
.cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }
.cover-placeholder { color: var(--accent-soft); font-size: 32px; letter-spacing: 3px; }
.card-body { padding: 18px 20px; }
.category {
  font-size: 12px; color: var(--accent); letter-spacing: 1px;
  border-bottom: 1px solid var(--accent-soft); display: inline-block; padding-bottom: 1px; margin-bottom: 10px;
}
.note-card h3, .news-card h3 { font-size: 16px; font-weight: 500; margin-bottom: 6px; letter-spacing: 0.5px; }
.note-meta, .news-date { font-size: 13px; color: var(--text-light); margin-bottom: 10px; }
.note-preview, .news-content { font-size: 14px; line-height: 1.8; color: #4a4642; margin-bottom: 12px; }
.news-content { white-space: pre-wrap; }
.note-footer, .news-footer {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--text-light); padding-top: 10px; border-top: 1px solid var(--border);
}
.note-actions button, .news-actions button {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-family: inherit; font-size: 12px; margin-left: 8px; letter-spacing: 1px;
}
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(58, 54, 50, 0.35);
  z-index: 200; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fefdfb; border-radius: 6px; width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto; padding: 28px 24px; border: 1px solid var(--border);
}
.modal h2 { font-size: 19px; font-weight: 500; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 5px; letter-spacing: 1px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 14px; font-family: inherit; background: white;
}
.form-group textarea { min-height: 120px; resize: vertical; line-height: 1.8; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cover-upload { display: flex; gap: 14px; align-items: flex-start; margin-top: 6px; }
.cover-preview {
  width: 76px; height: 106px; background: #f4f0eb; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.cover-preview img { width: 100%; height: 100%; object-fit: cover; }
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
.empty-state { text-align: center; padding: 70px 20px; color: var(--text-light); letter-spacing: 1px; }
.summary-options { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.summary-options label { font-size: 14px; display: flex; align-items: center; gap: 8px; }
@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  .notes-grid, .news-list { grid-template-columns: 1fr; }
  header h1 { font-size: 24px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>读书笔记 · 市场观察</h1>
    <p>阅读与记录</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('books')">读书笔记</button>
    <button class="tab" onclick="switchTab('news')">市场新闻</button>
  </div>

  <div id="books" class="section active">
    <div class="toolbar">
      <input type="text" class="search-box" id="searchInput" placeholder="搜索书名或笔记">
      <select class="filter-select" id="categoryFilter"><option value="">全部分类</option></select>
      <button class="btn" onclick="openBookModal()">新增笔记</button>
      <button class="btn btn-secondary" onclick="openSummaryModal('books')">导出总结</button>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <div id="news" class="section">
    <div class="toolbar">
      <input type="date" class="date-input" id="newsDateFilter">
      <button class="btn" onclick="openNewsModal()">新增新闻</button>
      <button class="btn btn-secondary" onclick="openSummaryModal('news')">导出总结</button>
    </div>
    <div class="news-list" id="newsList"></div>
  </div>
</div>

<!-- Book Modal -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h2 id="bookModalTitle">新增读书笔记</h2>
    <form id="bookForm">
      <input type="hidden" id="bookId">
      <div class="form-group"><label>书名</label><input type="text" id="title" required></div>
      <div class="form-row">
        <div class="form-group"><label>作者</label><input type="text" id="author"></div>
        <div class="form-group"><label>出版社</label><input type="text" id="publisher"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>分类</label>
          <input type="text" id="category" list="categoryList" placeholder="文学 / 商业 / 哲学">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="form-group"><label>日期</label><input type="date" id="readDate"></div>
      </div>
      <div class="form-group">
        <label>封面</label>
        <div class="cover-upload">
          <div class="cover-preview" id="coverPreview"><span style="font-size:12px;color:#b0a89e;">无</span></div>
          <div style="flex:1;">
            <input type="file" id="coverFile" accept="image/*" style="margin-bottom:8px;font-size:13px;">
            <input type="text" id="coverUrl" placeholder="或粘贴图片链接">
          </div>
        </div>
      </div>
      <div class="form-group"><label>笔记</label><textarea id="notes"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeBookModal()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- News Modal -->
<div class="modal-overlay" id="newsModal">
  <div class="modal">
    <h2 id="newsModalTitle">新增市场新闻</h2>
    <form id="newsForm">
      <input type="hidden" id="newsId">
      <div class="form-group"><label>日期</label><input type="date" id="newsDate" required></div>
      <div class="form-group"><label>标题（中文）</label><input type="text" id="newsTitleZh" required></div>
      <div class="form-group"><label>标题（英文）</label><input type="text" id="newsTitleEn"></div>
      <div class="form-group"><label>内容（中文）</label><textarea id="newsContentZh"></textarea></div>
      <div class="form-group"><label>内容（英文）</label><textarea id="newsContentEn"></textarea></div>
      <div class="form-group"><label>来源 / 备注</label><input type="text" id="newsSource"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeNewsModal()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Summary Modal -->
<div class="modal-overlay" id="summaryModal">
  <div class="modal" style="max-width:420px;">
    <h2 id="summaryModalTitle">导出总结</h2>
    <div class="summary-options">
      <label><input type="radio" name="period" value="week" checked> 本周</label>
      <label><input type="radio" name="period" value="month"> 本月</label>
      <label><input type="radio" name="period" value="quarter"> 本季度</label>
      <label><input type="radio" name="period" value="year"> 本年</label>
    </div>
    <div style="margin: 16px 0; display:flex; gap:10px; justify-content:center;">
      <button class="btn" onclick="exportSummary('image')">导出图片</button>
      <button class="btn btn-secondary" onclick="exportSummary('pdf')">导出 PDF</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('summaryModal').classList.remove('active')">关闭</button>
    </div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
const BOOKS_KEY = 'reading_notes_v3';
const NEWS_KEY = 'market_news_v1';
let books = JSON.parse(localStorage.getItem(BOOKS_KEY) || '[]');
let news = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
let editingBookId = null;
let editingNewsId = null;
let currentSummaryType = 'books';

const defaultCategories = ['文学', '商业', '哲学', '历史', '艺术', '个人成长', '小说', '其他'];

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(tab).classList.add('active');
  if (tab === 'news') renderNews();
}

function saveBooks() { localStorage.setItem(BOOKS_KEY, JSON.stringify(books)); renderBooks(); }
function saveNews() { localStorage.setItem(NEWS_KEY, JSON.stringify(news)); renderNews(); }
function getCategories() {
  const cats = new Set(defaultCategories);
  books.forEach(b => { if (b.category) cats.add(b.category); });
  return Array.from(cats);
}

function renderBooks() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  let filtered = books.filter(b => {
    const match = !search || b.title.toLowerCase().includes(search) || (b.author||'').toLowerCase().includes(search) || (b.notes||'').toLowerCase().includes(search);
    return match && (!cat || b.category === cat);
  });
  filtered.sort((a,b) => (b.readDate || b.createdAt) > (a.readDate || a.createdAt) ? 1 : -1);
  const grid = document.getElementById('notesGrid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">尚无笔记</div>';
  } else {
    grid.innerHTML = filtered.map(b => `
      <div class="note-card">
        <div class="cover-wrapper">${b.cover ? `<img src="${b.cover}">` : '<div class="cover-placeholder">书</div>'}</div>
        <div class="card-body">
          <div class="category">${b.category || '未分类'}</div>
          <h3>${escape(b.title)}</h3>
          <div class="note-meta">${escape(b.author||'')}${b.publisher ? ' · ' + escape(b.publisher) : ''}</div>
          <div class="note-preview">${escape(b.notes||'')}</div>
          <div class="note-footer">
            <span>${b.readDate || formatDate(b.createdAt)}</span>
            <div class="note-actions">
              <button onclick="exportBook('${b.id}')">导出</button>
              <button onclick="editBook('${b.id}')">编辑</button>
              <button onclick="deleteBook('${b.id}')">删除</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }
  updateCategoryFilter();
  updateDatalist();
}
function updateCategoryFilter() {
  const sel = document.getElementById('categoryFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部分类</option>' + getCategories().map(c => `<option value="${c}" ${c===cur?'selected':''}>${c}</option>`).join('');
}
function updateDatalist() {
  document.getElementById('categoryList').innerHTML = getCategories().map(c => `<option value="${c}">`).join('');
}
function openBookModal(book=null) {
  editingBookId = book ? book.id : null;
  document.getElementById('bookModalTitle').textContent = book ? '编辑笔记' : '新增读书笔记';
  document.getElementById('title').value = book?.title || '';
  document.getElementById('author').value = book?.author || '';
  document.getElementById('publisher').value = book?.publisher || '';
  document.getElementById('category').value = book?.category || '';
  document.getElementById('readDate').value = book?.readDate || new Date().toISOString().split('T')[0];
  document.getElementById('notes').value = book?.notes || '';
  document.getElementById('coverUrl').value = '';
  document.getElementById('coverFile').value = '';
  const prev = document.getElementById('coverPreview');
  prev.innerHTML = book?.cover ? `<img src="${book.cover}">` : '<span style="font-size:12px;color:#b0a89e;">无</span>';
  document.getElementById('bookModal').classList.add('active');
}
function closeBookModal() { document.getElementById('bookModal').classList.remove('active'); editingBookId = null; }
function editBook(id) { const b = books.find(x => x.id === id); if (b) openBookModal(b); }
function deleteBook(id) { if (confirm('删除这条笔记？')) { books = books.filter(b => b.id !== id); saveBooks(); } }

document.getElementById('coverFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('coverPreview').innerHTML = `<img src="${ev.target.result}">`; document.getElementById('coverUrl').value = ''; };
  r.readAsDataURL(f);
});
document.getElementById('coverUrl').addEventListener('input', e => {
  const u = e.target.value.trim();
  if (u) document.getElementById('coverPreview').innerHTML = `<img src="${u}" onerror="this.parentElement.innerHTML='<span style=\\'font-size:12px;color:#b0a89e\\'>失败</span>'">`;
});
document.getElementById('bookForm').addEventListener('submit', async e => {
  e.preventDefault();
  let cover = null;
  const file = document.getElementById('coverFile').files[0];
  const url = document.getElementById('coverUrl').value.trim();
  if (file) cover = await readAsDataURL(file);
  else if (url) cover = url;
  else if (editingBookId) cover = books.find(b => b.id === editingBookId)?.cover;
  const data = {
    title: document.getElementById('title').value.trim(),
    author: document.getElementById('author').value.trim(),
    publisher: document.getElementById('publisher').value.trim(),
    category: document.getElementById('category').value.trim(),
    readDate: document.getElementById('readDate').value,
    notes: document.getElementById('notes').value.trim(),
    cover
  };
  if (editingBookId) {
    const i = books.findIndex(b => b.id === editingBookId);
    if (i >= 0) books[i] = { ...books[i], ...data };
  } else {
    books.push({ id: Date.now().toString(), ...data, createdAt: new Date().toISOString() });
  }
  saveBooks(); closeBookModal();
});
function exportBook(id) {
  const b = books.find(x => x.id === id);
  if (!b) return;
  const div = document.createElement('div');
  div.style.cssText = 'width:400px;background:#fefdfb;padding:28px;font-family:"Noto Serif SC",serif;position:absolute;left:-9999px;';
  div.innerHTML = `
    ${b.cover ? `<img src="${b.cover}" style="width:100%;height:220px;object-fit:cover;margin-bottom:16px;">` : ''}
    <div style="font-size:12px;color:#6b5b4f;letter-spacing:2px;margin-bottom:8px;">${b.category||'笔记'}</div>
    <h2 style="font-size:20px;margin:0 0 6px;font-weight:500;">${escape(b.title)}</h2>
    <div style="color:#8a847c;font-size:13px;margin-bottom:14px;">${b.author||''}${b.publisher?' · '+b.publisher:''}</div>
    <div style="font-size:14px;line-height:1.85;white-space:pre-wrap;">${escape(b.notes||'')}</div>
    <div style="margin-top:16px;font-size:12px;color:#a89a8c;text-align:right;">${b.readDate||''}</div>
  `;
  document.body.appendChild(div);
  html2canvas(div, {scale:2, backgroundColor:'#faf8f5'}).then(canvas => {
    document.body.removeChild(div);
    const a = document.createElement('a');
    a.download = `${b.title}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

function renderNews() {
  const filterDate = document.getElementById('newsDateFilter').value;
  let list = [...news];
  if (filterDate) list = list.filter(n => n.date === filterDate);
  list.sort((a,b) => b.date > a.date ? 1 : -1);
  const container = document.getElementById('newsList');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">暂无市场新闻</div>';
    return;
  }
  container.innerHTML = list.map(n => `
    <div class="news-card">
      <div class="card-body">
        <div class="news-date">${n.date}</div>
        <h3>${escape(n.titleZh)}</h3>
        ${n.titleEn ? `<div style="font-size:13px;color:var(--text-light);margin-bottom:8px;">${escape(n.titleEn)}</div>` : ''}
        <div class="news-content">${escape(n.contentZh||'')}</div>
        ${n.contentEn ? `<div class="news-content" style="color:#666;font-size:13px;margin-top:6px;">${escape(n.contentEn)}</div>` : ''}
        ${n.source ? `<div style="font-size:12px;color:var(--text-light);margin-top:8px;">来源：${escape(n.source)}</div>` : ''}
        <div class="news-footer">
          <span></span>
          <div class="news-actions">
            <button onclick="editNews('${n.id}')">编辑</button>
            <button onclick="deleteNews('${n.id}')">删除</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}
function openNewsModal(item=null) {
  editingNewsId = item ? item.id : null;
  document.getElementById('newsModalTitle').textContent = item ? '编辑新闻' : '新增市场新闻';
  document.getElementById('newsDate').value = item?.date || new Date().toISOString().split('T')[0];
  document.getElementById('newsTitleZh').value = item?.titleZh || '';
  document.getElementById('newsTitleEn').value = item?.titleEn || '';
  document.getElementById('newsContentZh').value = item?.contentZh || '';
  document.getElementById('newsContentEn').value = item?.contentEn || '';
  document.getElementById('newsSource').value = item?.source || '';
  document.getElementById('newsModal').classList.add('active');
}
function closeNewsModal() { document.getElementById('newsModal').classList.remove('active'); editingNewsId = null; }
function editNews(id) { const n = news.find(x => x.id === id); if (n) openNewsModal(n); }
function deleteNews(id) { if (confirm('删除这条新闻？')) { news = news.filter(n => n.id !== id); saveNews(); } }
document.getElementById('newsForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    date: document.getElementById('newsDate').value,
    titleZh: document.getElementById('newsTitleZh').value.trim(),
    titleEn: document.getElementById('newsTitleEn').value.trim(),
    contentZh: document.getElementById('newsContentZh').value.trim(),
    contentEn: document.getElementById('newsContentEn').value.trim(),
    source: document.getElementById('newsSource').value.trim()
  };
  if (editingNewsId) {
    const i = news.findIndex(n => n.id === editingNewsId);
    if (i >= 0) news[i] = { ...news[i], ...data };
  } else {
    news.push({ id: Date.now().toString(), ...data });
  }
  saveNews(); closeNewsModal();
});

function openSummaryModal(type) {
  currentSummaryType = type;
  document.getElementById('summaryModalTitle').textContent = type === 'books' ? '导出读书总结' : '导出市场总结';
  document.getElementById('summaryModal').classList.add('active');
}

function getDateRange(period) {
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth();
  let start, end, label;
  if (period === 'week') {
    const day = today.getDay() || 7;
    start = new Date(today); start.setDate(today.getDate() - day + 1);
    end = new Date(start); end.setDate(start.getDate() + 6);
    label = '本周';
  } else if (period === 'month') {
    start = new Date(y, m, 1);
    end = new Date(y, m + 1, 0);
    label = `${y}年${m+1}月`;
  } else if (period === 'quarter') {
    const q = Math.floor(m / 3);
    start = new Date(y, q * 3, 1);
    end = new Date(y, q * 3 + 3, 0);
    label = `${y}年Q${q+1}`;
  } else {
    start = new Date(y, 0, 1);
    end = new Date(y, 11, 31);
    label = `${y}年`;
  }
  return {
    start: start.toISOString().split('T')[0],
    end: end.toISOString().split('T')[0],
    label
  };
}

function exportSummary(format) {
  const period = document.querySelector('input[name="period"]:checked').value;
  const range = getDateRange(period);
  let items = [];
  let title = '';

  if (currentSummaryType === 'books') {
    items = books.filter(b => {
      const d = b.readDate || (b.createdAt || '').split('T')[0];
      return d >= range.start && d <= range.end;
    });
    title = `读书笔记 · ${range.label}`;
  } else {
    items = news.filter(n => n.date >= range.start && n.date <= range.end);
    title = `市场观察 · ${range.label}`;
  }

  if (!items.length) { alert('该时间段暂无记录'); return; }

  const container = document.createElement('div');
  container.style.cssText = 'width:720px;background:#faf8f5;padding:36px 32px;font-family:"Noto Serif SC",serif;position:absolute;left:-9999px;';
  container.innerHTML = `
    <div style="text-align:center;margin-bottom:28px;">
      <h1 style="font-weight:500;letter-spacing:4px;font-size:26px;margin:0;">${title}</h1>
      <p style="color:#8a847c;letter-spacing:2px;margin-top:6px;font-size:13px;">${range.start} — ${range.end}</p>
    </div>
    ${items.map(item => {
      if (currentSummaryType === 'books') {
        return `
          <div style="background:#fff;border:1px solid #ece7e1;padding:16px 18px;margin-bottom:14px;display:flex;gap:14px;">
            ${item.cover ? `<img src="${item.cover}" style="width:60px;height:85px;object-fit:cover;">` : ''}
            <div style="flex:1;">
              <div style="font-weight:500;font-size:15px;">${escape(item.title)}</div>
              <div style="font-size:12px;color:#8a847c;margin:4px 0;">${item.author||''} · ${item.category||''} · ${item.readDate||''}</div>
              <div style="font-size:13px;line-height:1.7;color:#4a4642;">${escape((item.notes||'').slice(0,100))}${item.notes&&item.notes.length>100?'…':''}</div>
            </div>
          </div>`;
      } else {
        return `
          <div style="background:#fff;border:1px solid #ece7e1;padding:16px 18px;margin-bottom:14px;">
            <div style="font-size:12px;color:#8a847c;margin-bottom:4px;">${item.date}</div>
            <div style="font-weight:500;font-size:15px;margin-bottom:4px;">${escape(item.titleZh)}</div>
            ${item.titleEn ? `<div style="font-size:13px;color:#666;margin-bottom:8px;">${escape(item.titleEn)}</div>` : ''}
            <div style="font-size:13.5px;line-height:1.75;">${escape(item.contentZh||'')}</div>
            ${item.contentEn ? `<div style="font-size:13px;color:#666;margin-top:6px;">${escape(item.contentEn)}</div>` : ''}
          </div>`;
      }
    }).join('')}
  `;
  document.body.appendChild(container);

  html2canvas(container, {scale:2, backgroundColor:'#faf8f5'}).then(canvas => {
    document.body.removeChild(container);
    const filename = `${title.replace(/ · /g,'_')}`;
    if (format === 'image') {
      const a = document.createElement('a');
      a.download = `${filename}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } else {
      const img = canvas.toDataURL('image/jpeg', 0.92);
      const pdf = new jsPDF('p', 'mm', 'a4');
      const w = pdf.internal.pageSize.getWidth();
      const h = (canvas.height * w) / canvas.width;
      pdf.addImage(img, 'JPEG', 0, 0, w, Math.min(h, 280));
      pdf.save(`${filename}.pdf`);
    }
    document.getElementById('summaryModal').classList.remove('active');
  });
}

document.getElementById('searchInput').addEventListener('input', renderBooks);
document.getElementById('categoryFilter').addEventListener('change', renderBooks);
document.getElementById('newsDateFilter').addEventListener('change', renderNews);
document.getElementById('bookModal').addEventListener('click', e => { if (e.target.id === 'bookModal') closeBookModal(); });
document.getElementById('newsModal').addEventListener('click', e => { if (e.target.id === 'newsModal') closeNewsModal(); });

function escape(t) { const d = document.createElement('div'); d.textContent = t||''; return d.innerHTML; }
function formatDate(iso) { if (!iso) return ''; const d = new Date(iso); return d.toISOString().split('T')[0]; }
function readAsDataURL(file) { return new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(file); }); }

renderBooks();
</script>
</body>
</html>
